name: Build and publish 0.3.3

on:
  push:
    branches: [main]
    paths:
      - 'core/**'
      - 'fan-service/**'
      - 'scripts/**'
      - 'release/**'
      - 'GUI.py'
      - '*.spec'
      - 'install*'
      - 'uninstall.bat'
      - 'requirements-build.txt'
      - 'tests/**'
      - '.github/workflows/release.yml'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: lecoo-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'grasscaograss/lecoo-pro14-control-center'
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      LECOO_RUNTIME: ${{ github.workspace }}\dist\runtime
      LECOO_RELEASE: ${{ github.workspace }}\dist\release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Build and test the patched 0.3.3 core
        shell: pwsh
        run: ./scripts/build-core.ps1 -OutputDirectory $env:LECOO_RUNTIME
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.3'
      - name: Install pinned GUI build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build the service-aware GUI
        shell: pwsh
        run: ./scripts/build-gui.ps1 -RuntimeDirectory $env:LECOO_RUNTIME
      - name: Verify GUI delegates fan ownership
        run: python -m unittest discover -s tests -v
      - name: Package the GUI and system services
        shell: pwsh
        run: python scripts/release.py package --runtime $env:LECOO_RUNTIME --output $env:LECOO_RELEASE
      - name: Publish through the GitHub API
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish --output $env:LECOO_RELEASE
